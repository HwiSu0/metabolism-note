<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F8F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1413" media="(prefers-color-scheme: dark)">
<meta name="description" content="세포호흡·광합성 플래시카드, 개념 확인, 퀴즈, 모의시험">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="물질대사 노트">
<title>물질대사 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  --bg:#F6F8F7; --surface:#FFFFFF; --ink:#172026; --ink-2:#4F5C63; --ink-3:#86939A;
  --line:#E1E6E4; --line-2:#ECF0EE;
  --accent:#107558; --accent-ink:#FFFFFF; --accent-soft:#E5F2ED;
  --good:#1B8150; --good-soft:#E8F4EC; --bad:#C63B30; --bad-soft:#FBECEA;
  --scrim:rgba(16,24,22,.36); --nav-bg:rgba(246,248,247,.9);
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --pen:'Nanum Pen Script','Apple SD Gothic Neo',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1413; --surface:#161C1B; --ink:#E6ECEA; --ink-2:#A8B3B0; --ink-3:#6E7B78;
    --line:#26302E; --line-2:#1D2624;
    --accent:#4DC49D; --accent-ink:#0A1A14; --accent-soft:#163029;
    --good:#5CC98C; --good-soft:#15291F; --bad:#F07568; --bad-soft:#341B19;
    --scrim:rgba(0,0,0,.55); --nav-bg:rgba(15,20,19,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1413; --surface:#161C1B; --ink:#E6ECEA; --ink-2:#A8B3B0; --ink-3:#6E7B78;
  --line:#26302E; --line-2:#1D2624;
  --accent:#4DC49D; --accent-ink:#0A1A14; --accent-soft:#163029;
  --good:#5CC98C; --good-soft:#15291F; --bad:#F07568; --bad-soft:#341B19;
  --scrim:rgba(0,0,0,.55); --nav-bg:rgba(15,20,19,.9);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.shell{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 72px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:22px 10px}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand strong{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--ink-3)}
.range-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.range-btn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:11px 12px 10px;font-size:14px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab svg,.tab .t-short{display:none}
.tab svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding-top:24px}
h1{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0 0 4px;text-wrap:balance}
h2{font-size:13px;font-weight:600;color:var(--ink-3);margin:32px 0 8px}
.lead{color:var(--ink-2);font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;font-weight:500}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:default}
.link{border:0;background:none;padding:0;color:var(--ink-2);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.split>.btn{flex:1 1 0}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mt-l{margin-top:28px}
.toggle{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:13px;color:var(--ink-2);cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;height:34px;padding:0 14px;border-radius:7px;font-size:14px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

@media (hover:hover){
  .tab:hover{color:var(--ink-2)}
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost:hover{color:var(--ink)}
  .link:hover{color:var(--ink)}
  .mode:hover{border-color:var(--accent)}
  .chip-btn:hover{border-color:var(--accent);color:var(--accent)}
  .opt:hover:not(:disabled){border-color:var(--ink-3)}
}
@media (hover:none){
  .btn,.opt,.mode,.chip-btn,.omr-cell{transition:transform .1s,background .15s,border-color .15s}
  .btn:active:not(:disabled),.opt:active:not(:disabled),.mode:active,.chip-btn:active,.omr-cell:active{transform:scale(.97)}
}

/* home */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:18px}
.stat{padding:14px 16px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:21px;font-weight:500;line-height:1.3}
.stat b small{font-size:13px;color:var(--ink-3)}
.stat span{font-size:12px;color:var(--ink-3)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode{display:flex;flex-direction:column;gap:2px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .15s}
.mode b{font-size:15px;font-weight:600}
.mode span{font-size:13px;color:var(--ink-3)}
.units{border-top:1px solid var(--line)}
.unit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-2)}
.unit-name{font-weight:600;font-size:15px}
.unit-meta{font-size:12px;color:var(--ink-3)}
.unit-acts{display:flex;gap:4px}
.chip-btn{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.bar{grid-column:1/-1;height:3px;background:var(--line-2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.note{margin-top:28px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px;font-size:13px;color:var(--ink-2)}
.note b{color:var(--ink)}

/* progress */
.prog{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-3);margin-bottom:8px}
.pbar{height:3px;background:var(--line-2);border-radius:2px;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* flashcard */
.flash{position:relative;perspective:1600px;cursor:pointer;border-radius:16px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.flash.enter{animation:cardIn .22s ease-out}
@keyframes cardIn{from{opacity:.4;transform:translateY(6px) scale(.985)}}
.stamp{position:absolute;top:18px;z-index:2;font-family:var(--pen);font-size:32px;line-height:1;padding:3px 12px 1px;border:2px solid currentColor;border-radius:8px;opacity:0;pointer-events:none}
.stamp.know{left:18px;color:var(--good);transform:rotate(-8deg)}
.stamp.again{right:18px;color:var(--bad);transform:rotate(8deg)}
.flash-inner{display:grid;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.75,.2,1)}
.flash.is-flipped .flash-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;min-height:300px;display:flex;flex-direction:column;gap:10px}
.face.back{transform:rotateY(180deg)}
.tag{font-size:12px;color:var(--ink-3)}
.state{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.state.again{background:var(--bad-soft);color:var(--bad)}
.front-text{margin:auto 0;text-align:center;font-size:21px;font-weight:600;line-height:1.5;text-wrap:balance}
.back-text{margin:auto 0;white-space:pre-line;font-size:16px;line-height:1.8}
.hint{text-align:center;font-size:12px;color:var(--ink-3)}
.keys{font-size:12px;color:var(--ink-3);margin-top:14px;text-align:center}
.keys kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* question card */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 24px}
.qtext{font-size:17px;line-height:1.85;margin:10px 0 20px}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink-2);margin:0 3px;height:1.2em;vertical-align:-2px}
.blank.filled{height:auto;min-width:0;padding:0 4px;border-bottom-color:var(--good);color:var(--good);font-weight:600}
.blank-form{display:flex;gap:8px}
.blank-form input{flex:1;min-width:0;height:46px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.blank-form input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.ox{font-family:var(--mono);font-size:20px;height:56px}
.fb{margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--good-soft);display:flex;flex-direction:column;gap:6px}
.fb.bad{background:var(--bad-soft)}
.fb-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mark{font-family:var(--pen);font-size:30px;line-height:1;color:var(--good)}
.fb.bad .mark{color:var(--bad)}
.fb p{font-size:14.5px}
.ex{color:var(--ink-2);white-space:pre-line}

/* quiz */
.stem{font-size:16.5px;line-height:1.75;white-space:pre-line;margin:8px 0 0}
.bogi{margin-top:14px;padding:14px 16px 14px;border:1px solid var(--line);border-radius:10px;white-space:pre-line;font-size:15px;line-height:1.85;position:relative}
.bogi-label{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--surface);padding:0 10px;font-size:12px;color:var(--ink-3)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;line-height:1.55;transition:border-color .15s}
.opt .n{flex:none;color:var(--ink-3);width:1.2em}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .n{color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .n{color:var(--bad);font-weight:700}
.opt:disabled{cursor:default}

/* results */
.result{text-align:center;padding:24px 0 8px}
.score{display:inline-flex;align-items:baseline;gap:4px}
.score b{font-family:var(--mono);font-weight:500;font-size:56px;line-height:1;letter-spacing:-.03em}
.score span{font-size:18px;color:var(--ink-2)}
.score-mark{font-family:var(--pen);font-size:28px;color:var(--bad);display:block;margin-bottom:6px;transform:rotate(-4deg)}
.list{border-top:1px solid var(--line)}
.li{padding:16px 0;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.li-meta{font-size:12px;color:var(--ink-3);display:flex;gap:10px;justify-content:space-between;align-items:center}
.li-q{white-space:pre-line;font-size:15px}
.li-a{font-size:14px}
.li-a b{color:var(--good);font-weight:600;margin-right:6px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--line-2)}
th{font-weight:500;color:var(--ink-3);font-size:12px}
td.r,th.r{text-align:right}

/* mock */
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:18px 0 8px}
.omr-cell{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--mono);font-size:13px;color:var(--ink-2);cursor:pointer}
.omr-cell.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.omr-cell.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.omr-cell.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mq{display:grid;grid-template-columns:32px minmax(0,1fr);gap:4px 8px;padding:24px 0;border-bottom:1px solid var(--line-2);scroll-margin-top:60px}
.mq-n{font-family:var(--mono);font-size:15px;color:var(--ink-2);padding-top:9px}
.mq .opts{gap:6px;margin-top:14px}
.mq .opt{padding:10px 12px;font-size:14.5px}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.mbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mbar-in .grow{flex:1}
#mk-time{font-size:18px}
#mk-time.low{color:var(--bad)}
.running main{padding-bottom:80px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet-panel{border-radius:18px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head b{font-size:17px}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-size:12px;font-weight:600;color:var(--ink-3);padding:0;margin-bottom:4px}
.chk{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:14.5px}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none}
.chk .grow{flex:1}

.empty{padding:56px 0;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:16px;align-items:center}
.empty .mark{font-size:34px;color:var(--accent)}

@media (max-width:640px){
  .shell{padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
  .top{padding-block:14px 6px}
  .brand span{display:none}
  .tabs{position:fixed;top:auto;left:0;right:0;bottom:0;z-index:10;gap:0;overflow:visible;border-bottom:0;border-top:1px solid var(--line);background:var(--nav-bg);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
  .tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;margin:0;border:0;border-radius:10px;font-size:11px;font-weight:500}
  .tab svg{display:block;width:23px;height:23px}
  .tab .t-long{display:none}
  .tab .t-short{display:inline}
  .tab[aria-current="true"]{color:var(--accent)}
  .tab[aria-current="true"] svg{stroke-width:2.1}
  body.running .tabs{display:none}
  main{padding-top:12px}
  h1{font-size:20px}
  h2{margin-top:26px}
  .modes{gap:8px}
  .mode{padding:14px}
  .mode span{font-size:12px}
  .unit{grid-template-columns:minmax(0,1fr)}
  .unit-acts{order:3}
  .chip-btn{height:34px;padding:0 14px}
  .stat{padding:12px}
  .stat b{font-size:18px}
  .face{padding:20px 18px;min-height:52vh;min-height:52dvh}
  .front-text{font-size:20px}
  .back-text{font-size:15.5px}
  .qcard{padding:18px 16px 20px}
  .qtext{font-size:16.5px}
  .row.end>.btn,.row.split>.btn{flex:1 1 0}
  .btn{height:50px}
  .btn.sm{height:38px}
  .opt{padding:13px 14px;min-height:48px}
  .mq{grid-template-columns:26px minmax(0,1fr);scroll-margin-top:16px}
  .omr{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
  .omr-cell{height:40px}
  .score b{font-size:48px}
}
@media (max-width:359px){
  .modes{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .flash-inner,.pbar i{transition:none}
  .flash.enter{animation:none}
}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><strong>물질대사 노트</strong><span>세포호흡 · 광합성</span></div>
    <button class="range-btn" id="rangeBtn" data-act="openRange">전체 범위</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="학습 모드">
    <button class="tab" data-act="go" data-v="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg><span class="t-long">홈</span><span class="t-short">홈</span></button>

['u5','DNP 복용 시 나타나는 현상','산화적 인산화에 의한 ATP 합성 저해\n산소 소비 촉진, 체온 상승\n기질 수준 인산화에 의한 ATP 합성 촉진\n체중 감소, 과잉 섭취 시 사망'],
['u5','로테논','복합체 I → UQ 전자 전달 저해 → 전체 산화적 인산화 저해\n복합체 I은 환원 상태, 그 이후 단백질은 모두 산화 상태'],
['u5','시안화물(CN⁻), CO','복합체 IV → O₂ 전자 전달 저해 (예: 청산가리)\n산화적 인산화 차단 → NAD⁺ 공급 차단 → 해당과정·TCA 회로 중지'],
['u5','올리고마이신','ATP 합성효소의 F₀ (엽록체는 CF₀)에 결합 → 양성자 이동 저해 → ATP 합성 저해\n→ NAD⁺ 공급 저해로 TCA 회로·해당과정 정지'],
['u5','오로베르틴','ATP 합성효소의 F₁에 결합하여 양성자 이동(ATP 합성) 저해'],
['u5','그래프 (a): ADP+Pᵢ → 숙신산 → CN⁻','ADP+Pᵢ만: 거의 변화 없음 (전자 공급원 없음)\n숙신산 첨가: O₂ 소비·ATP 합성 모두 급증\nCN⁻ 첨가: 둘 다 멈춤'],
['u5','그래프 (b): 숙신산 → ADP+Pᵢ → 올리고마이신 → DNP','숙신산: 약간 증가\nADP+Pᵢ: O₂ 소비·ATP 합성 급증\n벤투리시딘/올리고마이신: 둘 다 멈춤\nDNP: O₂ 소비만 다시 증가, ATP 합성은 멈춘 상태 → 짝풀림'],
['u5','짝풀림제 / 전자 전달 저해제 / ATP 합성효소 저해제','짝풀림제: O₂ 소비↑, ATP 합성↓\n전자 전달 저해제: O₂ 소비↓, ATP 합성↓\nATP 합성효소 저해제: ATP 합성↓, O₂ 소비도↓ (서로 짝지어져 있으므로)'],

['u6','발효','해당과정에서만 유기물을 분해하여 ATP를 생성\n최종 산물이 CO₂ 이외의 유기물'],
['u6','발효에서 NAD⁺ 재순환이 중요한 이유','NADH → NAD⁺ 재생 → 해당과정(PGAL 탈수소효소 단계)이 계속 진행될 수 있음'],
['u6','피루브산의 운명','O₂ 없음: 젖산 발효(2젖산), 알코올 발효(2CO₂ + 2에탄올)\nO₂ 있음: TCA 회로 → 전자 전달계 → 6CO₂ + 12H₂O'],
['u6','젖산 발효','피루브산 + NADH+H⁺ → 젖산 + NAD⁺\n효소: 젖산 탈수소효소'],
['u6','알코올 발효 1단계','피루브산 → 아세트알데하이드 + CO₂\n효소: 피루브산 탈카르복실화효소 (TPP, Mg²⁺ 필요)'],
['u6','알코올 발효 2단계','아세트알데하이드 + NADH+H⁺ → 에탄올 + NAD⁺\n효소: 알코올 탈수소효소'],
['u6','아세트산 발효','에탄올 →(알코올 탈수소효소) 아세트알데하이드 →(아세트알데하이드 탈수소효소) 아세트산\n각 단계에서 NAD⁺ → NADH+H⁺'],
['u6','발효의 ATP 생성량','포도당 1분자당 2ATP (해당과정의 기질 수준 인산화만)'],

['u7','광합성의 원료와 생성물','원료: CO₂, H₂O\n생성물: 탄수화물(포도당), O₂, H₂O'],
['u7','광합성 전체 반응식','6CO₂ + 12H₂O →(빛에너지) C₆H₁₂O₆ + 6O₂ + 6H₂O'],
['u7','광합성 산소와 포도당 탄소의 기원','O₂: 물(H₂O)에서 유래\n포도당의 탄소: CO₂에서 유래'],
['u7','¹⁸O 실험 1: C¹⁸O₂ 공급','6C¹⁸O₂ + 12H₂O → C₆H₁₂¹⁸O₆ + 6O₂ + 6H₂¹⁸O\n¹⁸O는 포도당과 물에서 검출, O₂에서는 검출되지 않음'],
['u7','¹⁸O 실험 2: H₂¹⁸O 공급','6CO₂ + 12H₂¹⁸O → C₆H₁₂O₆ + 6¹⁸O₂ + 6H₂O\n¹⁸O는 발생하는 O₂에서 검출'],
['u7','광합성의 산화·환원','H₂O: 산화 (e⁻ 잃음) → O₂\nCO₂: 환원 (e⁻ 얻음) → 포도당'],
['u7','명반응 vs 암반응','명반응(광인산화 반응): 틸라코이드, 빛에너지 → ATP·NADPH\n암반응(탄소 고정 반응, 캘빈 회로): 스트로마, ATP·NADPH로 CO₂ 환원 → 포도당'],
['u7','엽록체의 구조','외막·내막의 2중막 + 틸라코이드, 그라나, 스트로마\n자체 DNA·리보솜 → 스스로 복제 가능'],
['u7','틸라코이드','엽록체 내부의 막으로 이루어진 납작한 주머니 모양 구조\n막: 엽록소(광색소), 전자 전달계, ATP 합성효소'],
['u7','루멘 / 그라나 / 스트로마','루멘: 틸라코이드 내강\n그라나: 틸라코이드가 겹겹이 쌓인 라멜라 (틸라코이드 밀집 지역)\n스트로마: 그 외 엽록체의 기질 부분'],
['u7','광색소의 위치와 종류 (고등 식물)','틸라코이드 막\n엽록소 a, 엽록소 b, 카로티노이드계 (카로틴, 잔토필)'],
['u7','엽록소 a : 엽록소 b','약 3 : 1 (고등 식물)\n엽록소는 초록색의 대표적 광합성 색소, 빛에너지를 1차적으로 수확'],
['u7','엽록소의 구조','포르피린 고리 (중심에 Mg) + 피톨 사슬\n피톨 사슬은 소수성 → 틸라코이드 막의 소수성 내부에 결합'],
['u7','엽록소 a와 b의 구조 차이','포르피린 고리의 곁가지\na: -CH₃ / b: -CHO'],

['u8','카로티노이드 계열 광색소','오렌지색 β-카로틴, 황색 제아크산틴 등\n주로 400~550nm 근처의 빛을 흡수'],
['u8','카로티노이드의 역할','엽록소가 잘 흡수하지 못하는 영역을 흡수 → 보조 색소\n광저해를 억제하는 데 기여'],
['u8','엽록소의 흥분과 형광 방출','바닥 상태 엽록소의 전자가 적색광·청색광 흡수 → 들뜬 상태\n즉시 바닥 상태로 떨어지며 잉여 에너지를 열과 형광으로 방출'],
['u8','흡수 스펙트럼 vs 작용 스펙트럼','흡수 스펙트럼: 파장별 색소의 빛 흡수율\n작용 스펙트럼: 파장별 광합성 속도 (O₂ 발생량)'],
['u8','(c) 엽록소 흡수 스펙트럼과 엽록체 작용 스펙트럼이 다른 이유','엽록소 흡수 스펙트럼에는 보조 색소가 흡수한 빛에 의해 일어난 광합성이 포함되지 않았기 때문'],
['u8','(d) 450~550nm에서 흡수 > 작용인 이유','카로티노이드 계열이 흡수한 빛의 광합성 효율이 떨어지기 때문'],
['u8','적색 저하 현상','680nm 이상에서 작용 스펙트럼이 흡수 스펙트럼보다 크게 낮아지는 현상\n파장이 길수록 엽록소 a의 전자가 일정 이상의 들뜬 상태에 도달하기 어려워 광합성량이 현저히 감소'],

['u9','명반응','틸라코이드 막에서 물의 광분해와 광인산화(전자 흐름)를 거쳐 빛에너지가 ATP와 NADPH의 화학 에너지로 전환되는 과정'],
['u9','틸라코이드 막의 구성','광계, 전자 전달계, ATP 합성효소'],
['u9','광계','반응 중심 + 광수집 복합체(LHC)\n빛에너지를 받아 전자를 들뜨게 하고, 들뜬 전자를 방출'],
['u9','광계 I','틸라코이드가 밀집되지 않은 지역에 많이 분포\n반응 중심 엽록소 a가 700nm를 가장 잘 흡수 → P700\nP700 + LHC I'],
['u9','광계 II','틸라코이드가 밀집된 지역에 많이 분포\n반응 중심 엽록소 a가 680nm를 가장 잘 흡수 → P680\nP680 + LHC II'],
['u9','물의 광분해','광계 II의 산소 발생 복합체(OEC)에서 빛에너지로 H₂O를 O₂로 산화\n2H₂O → O₂ + 4H⁺ + 4e⁻'],
['u9','산소 발생 복합체 (OEC)','망간(Mn)과 단백질로 구성\n섬광 4번당 O₂ 1분자 발생, H⁺은 루멘으로 방출'],
['u9','OEC의 S 상태 순환','S₀(가장 환원된 상태) → S₁(암조건에서 가장 안정) → S₂ → S₃ → [S₄] → O₂ 발생 → S₀\nS₄는 매우 짧게 존재하는 전이 상태'],
['u9','섬광 실험 결과','암적응 틸라코이드에 짧고 강한 섬광 → 3번째 섬광에서 O₂ 발생 최대, 이후 4번 주기로 증가\n(암조건에서 대부분 S₁ 상태이므로)\n섬광이 반복될수록 진폭이 줄어 일정해짐'],
['u9','광인산화 반응','틸라코이드 막에서 빛에너지를 이용해 광계, 전자 전달계, 화학 삼투를 통해 ATP를 합성하는 과정'],
['u9','유도공명','안테나 색소에서 반응 중심 색소로의 에너지 전이\n효율이 높지만 색소 분자 간 거리가 가까워야 함\n주개 분자의 형광 방출 파장이 받개 분자의 흡수 파장과 겹쳐야 함'],
['u9','안테나 색소의 에너지 전달 순서','카로티노이드 → 엽록소 b → 엽록소 a → 반응 중심 (P680)\n에너지가 높은(짧은 파장) 색소 → 낮은(긴 파장) 색소 방향'],
['u9','반응 중심 색소','특수한 엽록소 a 분자 (P680, P700)\n빛에너지가 모이면 고에너지 전자를 방출하고 산화됨'],
['u9','표준환원전위 (E⁰)','환원 반응이 일어나는 경향성을 수치로 나타낸 것\nE⁰ < 0이면 전자를 내주기 쉬워 환원력이 큼'],
['u9','1차 전자 수용체','광계 II: 페오피틴\n광계 I: 엽록소 A₀'],
['u9','비순환적 전자 흐름 경로','H₂O → P680 → 페오피틴 → PQ → Cyt b₆f 복합체 → PC(플라스토시아닌) → P700 → A₀ → A₁(필로퀴논) → Fe-S → Fd(페레독신) → Fd:NADP⁺ 산화환원효소 → NADPH'],
['u9','플라스토퀴논(PQ)의 작용','광계 II의 전자가 페오피틴을 거쳐 PQ를 환원 (PQ → PQH₂)\n전자가 Cyt b₆f 복합체로 이동하며 H⁺이 루멘으로 펌핑'],
['u9','비순환적 전자 흐름 (광인산화)','광계 II 전자 → 전자 전달계 → 광계 I → NADP⁺\n전자가 원래 엽록소로 돌아가지 않음, 광계 I·II 모두 관여\n결과: ATP, NADPH, O₂ 생성'],
['u9','순환적 전자 흐름 (광인산화)','광계 I의 P700 전자 → Fd → PQ → Cyt b₆f 복합체 → P700으로 되돌아옴\n광계 I만 관여, ATP만 합성 (NADPH·O₂ 생성 없음)'],
['u9','순환적 전자 흐름이 잘 일어날 때와 의의','NADP⁺가 부족할 때, ATP 요구는 크나 NADPH 요구가 상대적으로 작을 때\nATP 공급 + 광저해를 막는 데 기여'],
['u9','루멘과 스트로마의 pH','루멘 pH 4~5, 스트로마 pH 7~8\nH⁺이 ATP 합성효소를 통해 루멘 → 스트로마로 확산하며 ATP 합성 (화학 삼투)'],
['u9','H⁺ 농도 기울기 형성 요인 3가지','① 물의 광분해 (루멘에 H⁺ 방출)\n② PQ와 Cyt b₆f 복합체가 루멘으로 H⁺ 펌핑\n③ 스트로마에서 NADP⁺ 환원 (H⁺ 소모)'],
['u9','광저해 (광산화)','잎이 이용할 수 있는 수준 이상의 과도한 빛에 노출되어 광합성이 저해되는 현상'],
['u9','동적 광저해','약간 과도한 빛, 주로 양지 식물\n흡수된 빛에너지가 열로 발산 → 광합성 효율은 일시적 감소, 최대 광합성률은 거의 변화 없음'],
['u9','만성적 광저해','과도한 빛으로 광합성계가 손상, 주로 음지 식물\n광계 II 반응 중심 단백질 손상 → 광합성 효율과 최대 광합성률 모두 감소'],
['u9','광보상점 / 광포화점','광보상점: 광합성량 = 세포 호흡량인 빛의 세기 (CO₂ 순방출량 0)\n광포화점: 광합성량이 최대가 되는 최소한의 빛의 세기'],
['u9','양지 식물 vs 음지 식물','양지 식물: 빛이 많을 때 최적 생장, 광보상점·광포화점이 높음\n음지 식물: 빛이 적을 때 최적 생장, 광보상점·광포화점이 낮음'],

['u10','탄소 고정 반응','명반응 산물인 ATP와 NADPH를 이용해 캘빈 회로 등으로 CO₂를 고정하여 6탄당을 합성하는 과정'],
['u10','탄소 고정 반응 전체식','6CO₂ + 12H₂O + 12NADPH + 18ATP → 과당-6-인산 + 12NADP⁺ + 6H⁺ + 18ADP + 17인산'],
['u10','캘빈 회로의 장소와 3단계','스트로마의 여러 효소\n① 탄소 고정 ② 환원 ③ RuBP 재생'],
['u10','RuBP / PGA / BPGA / G3P','RuBP: 리불로오스-1,5-이인산 (5C)\nPGA: 3-포스포글리세르산 (3C)\nBPGA: 1,3-비스포스포글리세르산\nG3P(=PGAL): 글리세르알데하이드-3-인산'],
['u10','탄소 고정 단계','3CO₂ + 3RuBP(5C) →(루비스코) 6분자 3PG(3C)'],
['u10','환원 단계','6 3PG →(6ATP) 6 BPGA →(6NADPH) 6 PGAL(G3P)'],
['u10','RuBP 재생 단계','6PGAL 중 1분자는 회로를 빠져나가 포도당 합성에 사용\n나머지 5PGAL →(3ATP) 3RuBP'],
['u10','PGAL 1분자 합성에 필요한 재료','CO₂ 3분자, ATP 9분자, NADPH 6분자'],
['u10','포도당 1분자 합성에 필요한 재료','CO₂ 6분자, ATP 18분자, NADPH 12분자'],

['u4','FADH₂ 1분자의 전자가 O₂까지 전달될 때 막간 강으로 펌핑되는 H⁺의 총 개수는?',['2','4','6','8','10'],2,'복합체 II 0 + 복합체 III 4 + 복합체 IV 2 = 6H⁺'],
['u4','전자 전달계에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?\n\nㄱ. 복합체 I의 1차 전자수용체는 FMN이다.\nㄴ. 복합체 II에서 양성자 펌핑이 일어난다.\nㄷ. 복합체 IV에서는 4개의 e⁻당 2분자의 H₂O가 생성된다.',B2,2,'ㄴ. 복합체 II에서는 양성자 펌핑이 일어나지 않는다.'],
['u4','고등학교 교육과정 기준(H⁺ 4개당 ATP 1분자)으로 포도당 1분자의 세포호흡에서 생성되는 ATP는?',['30ATP','32ATP','34ATP','36ATP','38ATP'],1,'4ATP + 10NADH × 2.5 + 2FADH₂ × 1.5 = 32ATP'],
['u4','H⁺ 4개당 ATP 1분자가 합성된다고 가정할 때, NADH 3분자와 FADH₂ 2분자가 전자 전달계에서 산화되어 생성되는 ATP는?',['9','10','10.5','11','13'],2,'3 × 2.5 + 2 × 1.5 = 7.5 + 3 = 10.5'],
['u4','포도당 1몰의 완전 연소 에너지를 686kcal, ATP 1몰 합성에 필요한 에너지를 7.3kcal라 하고 38ATP가 생성된다고 가정할 때, 세포호흡의 에너지 효율은?',['약 20%','약 34%','약 40%','약 60%','약 75%'],2,'38 × 7.3 = 277.4 → 277.4 ÷ 686 ≈ 0.40'],
['u4','산화적 인산화가 활발히 일어날 때에 대한 설명으로 옳은 것은?',['막간 강의 pH가 기질보다 높다.','H⁺은 ATP 합성효소를 통해 기질에서 막간 강으로 이동한다.','전자는 O₂에서 NADH 방향으로 이동한다.','막간 강의 H⁺ 농도가 기질보다 높다.','복합체 II에서 가장 많은 H⁺이 펌핑된다.'],3,'H⁺은 막간 강 → 기질 방향으로 ATP 합성효소를 통과하며 ATP를 합성한다.'],

['u5','DNP를 복용했을 때 나타나는 현상으로 옳지 않은 것은?',['산소 소비가 감소한다.','체온이 상승한다.','산화적 인산화에 의한 ATP 합성이 저해된다.','기질 수준 인산화에 의한 ATP 합성이 촉진된다.','체중이 감소한다.'],0,'DNP는 짝풀림제로 H⁺ 농도 기울기를 해소하므로 전자 전달이 빨라져 산소 소비는 증가한다.'],
['u5','로테논을 처리한 미토콘드리아에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?\n\nㄱ. 복합체 I은 환원 상태로 머무른다.\nㄴ. 시토크롬 c는 환원 상태로 머무른다.\nㄷ. 복합체 I에서 UQ로의 전자 전달이 저해된다.',B2,2,'ㄴ. 복합체 I 이후의 단백질은 모두 산화 상태이다.'],
['u5','시안화물(CN⁻)을 처리했을 때에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?\n\nㄱ. 복합체 IV에서 O₂로의 전자 전달이 저해된다.\nㄴ. 산소 소비가 증가한다.\nㄷ. NAD⁺ 공급이 차단되어 해당과정과 TCA 회로의 작동이 중지된다.',B2,2,'ㄴ. 전자 전달이 멈추므로 산소 소비도 멈춘다.'],
['u5','분리한 미토콘드리아에 숙신산과 ADP+Pᵢ를 넣은 뒤 올리고마이신을 첨가하고, 이어서 DNP를 첨가하였다. DNP 첨가 후의 변화로 옳은 것은?',['O₂ 소비와 ATP 합성이 모두 증가한다.','O₂ 소비는 증가하고 ATP 합성은 증가하지 않는다.','O₂ 소비는 감소하고 ATP 합성은 증가한다.','O₂ 소비와 ATP 합성 모두 변화가 없다.','O₂ 소비는 변화 없고 ATP 합성만 증가한다.'],1,'DNP가 H⁺ 기울기를 해소하여 전자 전달(O₂ 소비)은 재개되지만, ATP 합성효소가 막혀 있고 기울기도 사라져 ATP는 합성되지 않는다 (짝풀림).'],
['u5','ATP 합성효소의 F₀와 엽록체의 CF₀에 결합하여 양성자 이동을 저해하는 물질은?',['로테논','시안화물','DNP','올리고마이신','오로베르틴'],3,'오로베르틴은 F₁에 결합한다.'],
['u5','짝풀림 단백질(UCP)에 대한 설명으로 옳은 것은?',['H⁺을 막간 강으로 펌핑하여 ATP 합성을 촉진한다.','전자 전달을 직접 차단한다.','H⁺이 ATP 합성효소를 거치지 않고 기질로 유입되는 경로를 제공하여 열을 발생시킨다.','ATP 합성효소의 F₁에 결합한다.','동면 동물에서는 작용하지 않는다.'],2,'UCP-1은 갓 태어난 새끼나 동면 동물의 체온 유지(열생성)에 작용한다.'],
['u5','분리한 미토콘드리아에 ADP+Pᵢ만 넣었을 때는 O₂ 소비가 거의 없다가, 숙신산을 넣자 급증하였다. 그 이유로 가장 적절한 것은?',['숙신산이 ATP 합성효소를 활성화하기 때문','숙신산이 전자 공급원(FADH₂ 생성)이 되기 때문','숙신산이 짝풀림제로 작용하기 때문','숙신산이 O₂를 직접 공급하기 때문','숙신산이 복합체 IV를 저해하기 때문'],1,'숙신산 → 푸마르산 (복합체 II)에서 FADH₂가 생성되어 전자 전달계에 전자가 공급된다.'],

['u6','알코올 발효에서 CO₂가 방출되는 반응의 효소와 필요한 보조 인자로 옳은 것은?',['젖산 탈수소효소 – NADH','알코올 탈수소효소 – NAD⁺','피루브산 탈카르복실화효소 – TPP, Mg²⁺','피루브산 탈수소효소 – CoA','아세트알데하이드 탈수소효소 – FAD'],2,''],
['u6','젖산 발효에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?\n\nㄱ. NADH가 NAD⁺로 산화된다.\nㄴ. CO₂가 발생한다.\nㄷ. 포도당 1분자당 순 2ATP가 생성된다.',B2,2,'ㄴ. 젖산 발효에서는 CO₂가 발생하지 않는다.'],
['u6','아세트산 발효에 대한 설명으로 옳은 것은?',['피루브산이 직접 아세트산으로 전환된다.','NADH가 NAD⁺로 산화되며 진행된다.','에탄올이 아세트알데하이드를 거쳐 아세트산으로 산화되며, NAD⁺가 NADH로 환원된다.','CO₂가 2분자 방출된다.','젖산으로부터 일어난다.'],2,''],
['u6','산소가 없는 조건에서 발효가 해당과정의 지속에 필요한 이유는?',['ATP를 대량 생산하기 위해','NADH를 NAD⁺로 재생하여 PGAL 탈수소효소 반응이 계속되게 하기 위해','CO₂를 제거하기 위해','피루브산을 아세틸-CoA로 만들기 위해','FADH₂를 공급하기 위해'],1,''],
['u6','포도당 1분자가 알코올 발효될 때의 최종 산물은?',['2젖산','2CO₂ + 2에탄올','6CO₂ + 12H₂O','2아세틸-CoA + 2CO₂','2아세트산 + 2CO₂'],1,''],

['u7','¹⁸O로 표지한 물(H₂¹⁸O)을 공급하여 광합성을 시켰을 때 ¹⁸O가 검출되는 물질은?',['포도당','CO₂','O₂','생성된 물','RuBP'],2,'광합성에서 발생하는 O₂는 물에서 유래한다.'],
['u7','C¹⁸O₂를 공급하여 광합성을 시켰을 때 ¹⁸O가 검출되는 물질만을 옳게 고른 것은?',['O₂','포도당','포도당, 생성된 물','O₂, 생성된 물','O₂, 포도당, 생성된 물'],2,'6C¹⁸O₂ + 12H₂O → C₆H₁₂¹⁸O₆ + 6O₂ + 6H₂¹⁸O'],
['u7','엽록체에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?\n\nㄱ. 엽록소는 틸라코이드 막에 존재한다.\nㄴ. 틸라코이드 내강을 스트로마라 한다.\nㄷ. DNA와 리보솜이 있어 스스로 복제할 수 있다.',B2,2,'ㄴ. 틸라코이드 내강은 루멘이다.'],
['u7','엽록소에 대한 설명으로 옳지 않은 것은?',['포르피린 고리에 피톨 사슬이 붙어 있다.','피톨 사슬은 소수성이다.','고등 식물에서 엽록소 a : b는 약 3 : 1이다.','엽록소 b는 엽록소 a의 -CH₃ 자리에 -CHO를 가진다.','틸라코이드 내강(루멘)에 녹아 있다.'],4,'엽록소는 틸라코이드 막에 결합되어 있다.'],
['u7','광합성의 산화·환원에 대한 설명으로 옳은 것은?',['CO₂가 산화되어 O₂가 된다.','H₂O가 환원되어 포도당이 된다.','H₂O가 산화되어 O₂가 되고, CO₂는 환원되어 포도당이 된다.','O₂가 환원되어 H₂O가 된다.','포도당이 산화되어 CO₂가 된다.'],2,''],

['u8','광합성 색소의 흡수 스펙트럼과 엽록체의 작용 스펙트럼을 비교할 때, 450~550nm 구간에서 흡수 스펙트럼이 작용 스펙트럼보다 높게 나타나는 이유는?',['엽록소 b가 이 파장을 흡수하지 못하기 때문','카로티노이드 계열이 흡수한 빛의 광합성 효율이 떨어지기 때문','적색 저하 현상 때문','이 파장에서 광계 II가 손상되기 때문','보조 색소의 광합성이 작용 스펙트럼에 포함되지 않기 때문'],1,''],
['u8','엽록소의 흡수 스펙트럼과 엽록체의 작용 스펙트럼에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?\n\nㄱ. 500~600nm에서 작용 스펙트럼이 엽록소의 흡수 스펙트럼보다 높게 나타난다.\nㄴ. 두 스펙트럼의 차이는 보조 색소가 흡수한 빛에 의한 광합성이 엽록소의 흡수 스펙트럼에 포함되지 않았기 때문이다.\nㄷ. 680nm보다 긴 파장의 빛은 엽록소가 전혀 흡수하지 못한다.',B1,2,'ㄷ. 엽록소 a는 680nm보다 긴 파장도 흡수하지만, 전자가 충분히 들뜨지 못해 광합성량이 급감한다 (적색 저하).'],
['u8','적색 저하 현상에 대한 설명으로 옳은 것은?',['680nm 이상에서 엽록소가 빛을 전혀 흡수하지 못하는 현상이다.','파장이 길어질수록 엽록소 a의 전자가 일정 이상의 들뜬 상태에 도달하기 어려워 광합성량이 급감하는 현상이다.','카로티노이드가 적색광을 흡수하여 광합성이 증가하는 현상이다.','적색광에서 광계 II가 손상되는 현상이다.','적색광을 비추면 순환적 전자 흐름만 일어나는 현상이다.'],1,''],

['u9','비순환적 전자 흐름에서 전자의 이동 순서로 옳은 것은?',['H₂O → P680 → 페오피틴 → PQ → Cyt b₆f → PC → P700 → Fd → NADP⁺','H₂O → P700 → PQ → Cyt b₆f → PC → P680 → Fd → NADP⁺','H₂O → P680 → PC → PQ → Cyt b₆f → P700 → Fd → NADP⁺','NADPH → Fd → P700 → PC → Cyt b₆f → PQ → P680 → H₂O','H₂O → P680 → 페오피틴 → PC → Cyt b₆f → PQ → P700 → Fd → NADP⁺'],0,''],
['u9','광인산화에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?\n\nㄱ. 순환적 전자 흐름에는 광계 I만 관여한다.\nㄴ. 순환적 전자 흐름에서도 O₂가 발생한다.\nㄷ. 비순환적 전자 흐름의 결과 ATP, NADPH, O₂가 모두 생성된다.',B2,2,'ㄴ. 순환적 전자 흐름에서는 물의 광분해가 일어나지 않으므로 O₂가 발생하지 않는다.'],
['u9','암적응시킨 틸라코이드 막에 아주 짧고 강한 섬광을 비출 때, O₂ 발생량이 처음으로 최대가 되는 섬광 횟수는?',['1번째','2번째','3번째','4번째','5번째'],2,'암조건에서 OEC는 대부분 가장 안정한 S₁ 상태이므로 3번의 섬광(S₁→S₂→S₃→S₄)만에 O₂가 발생한다. 이후 4번 주기로 증가한다.'],
['u9','틸라코이드 막을 경계로 한 H⁺ 농도 기울기 형성에 기여하지 않는 것은?',['물의 광분해로 루멘에 H⁺ 방출','PQ와 Cyt b₆f 복합체에 의한 루멘으로의 H⁺ 펌핑','스트로마에서 NADP⁺가 NADPH로 환원되며 H⁺ 소모','ATP 합성효소를 통한 루멘 → 스트로마로의 H⁺ 확산'],3,'ATP 합성효소를 통한 H⁺ 확산은 형성된 기울기를 이용(해소)하는 과정이다.'],
['u9','광저해에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?\n\nㄱ. 동적 광저해가 일어나도 최대 광합성률은 거의 변화가 없다.\nㄴ. 만성적 광저해는 주로 양지 식물에서 나타난다.\nㄷ. 만성적 광저해는 광계 II의 반응 중심 단백질이 손상된 경우이다.',B2,2,'ㄴ. 만성적 광저해는 주로 음지 식물, 동적 광저해는 주로 양지 식물에서 나타난다.'],
['u9','광계에 대한 설명으로 옳은 것은?',['광계 I의 반응 중심 색소는 P680이다.','광계 II는 틸라코이드가 밀집되지 않은 지역에 많이 분포한다.','광계 II의 1차 전자 수용체는 페오피틴이다.','광계 I에서 물의 광분해가 일어난다.','광계는 반응 중심만으로 구성된다.'],2,'광계 I: P700, 1차 전자 수용체 A₀ / 광계 II: P680, 페오피틴, OEC'],
['u9','유도공명에 대한 설명으로 옳지 않은 것은?',['에너지 전이 효율이 높다.','색소 분자 간의 거리가 가까워야 한다.','주개 분자의 형광 방출 파장이 받개 분자의 흡수 파장과 겹쳐야 한다.','에너지는 흡수 파장이 긴 색소에서 짧은 색소 방향으로 전달된다.','에너지는 최종적으로 반응 중심 색소로 모인다.'],3,'에너지는 흡수 파장이 짧은(에너지가 높은) 색소에서 긴(에너지가 낮은) 색소 방향으로 전달된다: 카로티노이드 → 엽록소 b → 엽록소 a → P680.'],

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash = s => { let x = 5381; for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const mq = q => !!(window.matchMedia && matchMedia(q).matches);
const fine = mq('(pointer:fine)');
const reduced = mq('(prefers-reduced-motion: reduce)');

const cards  = CARDS.map(([u, f, b]) => ({id: 'c' + hash(u + f), u, f, b}));
const checks = CHECKS.map(([u, t, q, a, ex]) => ({id: 'k' + hash(u + q), u, t, q, a, ex: ex || ''}));
const quiz   = QUIZ.map(([u, q, o, a, ex]) => ({id: 'q' + hash(u + q), u, q, o, a, ex: ex || ''}));
const byId = {}; [...cards, ...checks, ...quiz].forEach(x => byId[x.id] = x);

const LS = 'mbnote.v1';
let store = {known: {}, again: {}, wrong: {}, stats: {a: 0, c: 0}, range: null};
try { const r = localStorage.getItem(LS); if (r) store = Object.assign(store, JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };

const inRange = u => !store.range || !store.range.length || store.range.includes(u);
function rangeLabel() {
  const r = store.range;
  if (!r || !r.length || r.length === UNITS.length) return '전체 범위';
  for (const c of CHAPTERS) if (r.length === c.units.length && c.units.every(u => r.includes(u))) return c.name;
  if (r.length === 1) return UN[r[0]].name;
  return r.length + '개 단원';
}
function record(id, ok, review) {
  store.stats.a++;
  if (ok) { store.stats.c++; if (review) delete store.wrong[id]; }
  else { const w = store.wrong[id] || {n: 0}; w.n++; w.t = Date.now(); store.wrong[id] = w; }
  save();
}
const norm = s => String(s).toLowerCase()
  .replace(/[₀-₉]/g, c => String(c.charCodeAt(0) - 0x2080))
  .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => String('⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(c)))
  .replace(/⁺/g, '+').replace(/[⁻−–]/g, '-')
  .replace(/[\s\-~·.,()\[\]'"]/g, '');
const firstAns = a => String(a).split('|')[0];
const ansText = x => x.t === 'ox' ? (x.a ? 'O' : 'X') : firstAns(x.a);
function splitStem(q) { const i = q.indexOf('\n\n'); return i < 0 ? {head: q, bogi: ''} : {head: q.slice(0, i), bogi: q.slice(i + 2)}; }
function stemHtml(q) {
  const {head, bogi} = splitStem(q);
  return `<p class="stem">${esc(head)}</p>${bogi ? `<div class="bogi"><span class="bogi-label">보기</span>${esc(bogi)}</div>` : ''}`;
}
function blankHtml(q, fill) {
  return esc(q).replace(/\(__\)|____/g, fill != null ? `<span class="blank filled">${esc(fill)}</span>` : '<span class="blank"></span>');
}
const empty = (msg, extra = '') => `<div class="empty"><span class="mark">✓</span><p>${msg}</p>${extra}</div>`;

      ${opts}

}
let lastSwipe = 0;
function bindSwipe() {
  const el = document.querySelector('.flash');
  if (!el) return;
  const sK = el.querySelector('.stamp.know'), sA = el.querySelector('.stamp.again');
  let id = null, sx = 0, sy = 0, dx = 0, moved = false;
  const settle = () => {
    el.style.transition = 'transform .25s cubic-bezier(.2,.75,.2,1)';
    el.style.transform = '';
    sK.style.opacity = sA.style.opacity = 0;
  };
  el.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || id !== null) return;
    id = e.pointerId; sx = e.clientX; sy = e.clientY; dx = 0; moved = false;
    el.classList.remove('enter');
    el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    dx = e.clientX - sx;
    const dy = e.clientY - sy;
    if (!moved) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        moved = true;
        try { el.setPointerCapture(id); } catch (_) {}
      } else if (Math.abs(dy) > 10) { id = null; return; }
      else return;
    }
    el.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`;
    const p = Math.min(1, Math.abs(dx) / 100);
    sK.style.opacity = dx > 0 ? p : 0;
    sA.style.opacity = dx < 0 ? p : 0;
  });
  el.addEventListener('pointerup', e => {
    if (e.pointerId !== id) return;
    id = null;
    if (!moved) return;
    lastSwipe = Date.now();
    if (Math.abs(dx) < 90) { settle(); return; }
    const k = dx > 0 ? '1' : '0';
    if (reduced) { ACT.fcMark({k}); return; }
    el.style.transition = 'transform .2s ease-in';
    el.style.transform = `translateX(${Math.sign(dx) * window.innerWidth}px) rotate(${Math.sign(dx) * 16}deg)`;
    setTimeout(() => ACT.fcMark({k}), 170);
  });
  el.addEventListener('pointercancel', e => { if (e.pointerId === id) { id = null; settle(); } });
}

  if (!L.length) { app.innerHTML = empty('이 범위에는 문항이 없어요.'); return; }
  if (ck.i >= L.length) {
    const pct = Math.round(ck.c / L.length * 100);
    app.innerHTML = `<div class="result"><span class="score-mark">${pct >= 90 ? '아주 좋아요!' : pct >= 70 ? '좋아요' : '한 번 더!'}</span>

        <p><b>정답</b> ${esc(ansText(x))}</p>
        ${x.ex ? `<p class="ex">${esc(x.ex)}</p>` : ''}
        ${!ck.ok && x.t === 'bl' ? `<p><button class="link" data-act="ckOverride">같은 뜻으로 썼어요 · 정답 처리</button></p>` : ''}
      </div>

    <div class="prog"><span>${esc(UN[x.u].name)}${ck.review ? ' · 오답 복습' : ''}</span><span class="num">${ck.i + 1} / ${L.length}</span></div>
    <div class="pbar"><i style="width:${ck.i / L.length * 100}%"></i></div>
    <div class="qcard"><span class="tag">${x.t === 'ox' ? 'O / X' : '빈칸 채우기'}</span>${body}${ctl}</div>`;
  if (!answered && x.t === 'bl' && fine) $('#ck-input').focus();
  if (answered && fine) $('#nextBtn').focus();
}
function ckAnswer(ok, input) {
  const x = ck.list[ck.i];
  ck.ans = true; ck.ok = ok; ck.input = input || '';
  if (ok) ck.c++;
  record(x.id, ok, ck.review);
  renderCheck();
}

/* ---------- 퀴즈 ---------- */

}

      ${qz.miss.length ? `<h2>틀린 문제</h2><div class="list">${qz.miss.map(x => `<div class="li">

      <div class="row split mt-l"><button class="btn" data-act="qzSetup">설정으로</button><button class="btn primary" data-act="qzAgain">새 문제로 다시</button></div>`;

    <div class="qcard">

      <div class="row end mt"><button class="btn primary" id="nextBtn" data-act="qzNext">${qz.i + 1 < L.length ? '다음' : '결과 보기'} →</button></div>` : ''}

/* ---------- 모의시험 ---------- */
let mk = {phase: 'setup', n: 20}, timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    const left = mk.end - Date.now();
    if (left <= 0) { mkSubmit(); return; }
    const el = document.getElementById('mk-time');
    if (el) { el.textContent = fmt(left); el.classList.toggle('low', left < 60000); }
  }, 500);
}
function mkSubmit() {
  stopTimer();
  mk.used = Date.now() - mk.start;
  mk.c = 0;
  mk.list.forEach((x, i) => { const ok = mk.ans[i] === x.a; if (ok) mk.c++; record(x.id, ok, false); });
  mk.phase = 'done';
  if (view === 'mock') { render(); window.scrollTo(0, 0); }
}
function renderMock() {
  const pool = quiz.filter(x => inRange(x.u)).length;
  if (mk.phase === 'setup') {
    const opts = [15, 20, 25].filter(v => v <= pool);
    if (!opts.length && pool) opts.push(pool);
    if (!opts.includes(mk.n)) mk.n = opts[opts.length - 1] || 0;
    app.innerHTML = `<h1>모의시험</h1>
      <p class="lead">${esc(rangeLabel())} · 학습지 범위에서 무작위 출제 · 문항당 1분 30초</p>
      ${pool ? `<h2>문항 수</h2>
      <div class="seg" role="group" aria-label="문항 수">${opts.map(v => `<button data-act="mkN" data-n="${v}" aria-pressed="${mk.n === v}">${v}문항 · ${Math.round(v * 1.5)}분</button>`).join('')}</div>
      <div class="mt-l"><button class="btn primary block" data-act="mkStart">시험 시작</button></div>` : empty('이 범위에는 문제가 없어요.')}
      <div class="note"><b>기출 기반 모의고사</b><br>지난 시험지를 보내면 출제 경향·배점·문항 형식을 반영한 모의고사를 이곳에 추가합니다.</div>`;
    return;
  }
  const L = mk.list, done = mk.phase === 'done';
  const cell = (x, i) => {
    const cls = done ? (mk.ans[i] === x.a ? 'ok' : 'no') : (mk.ans[i] != null ? 'on' : '');
    return `<button class="omr-cell ${cls}" data-act="mkJump" data-i="${i}" aria-label="${i + 1}번">${i + 1}</button>`;
  };
  const qs = L.map((x, i) => `<section class="mq" id="mq-${i}">
      <div class="mq-n">${i + 1}.</div>
      <div>${stemHtml(x.q)}
        <div class="opts">${x.o.map((t, j) => {
          let cls = '';
          if (done) cls = j === x.a ? 'right' : j === mk.ans[i] ? 'wrong' : '';
          else if (mk.ans[i] === j) cls = 'sel';
          return `<button class="opt ${cls}" data-act="mkPick" data-q="${i}" data-i="${j}" ${done ? 'disabled' : ''}><span class="n">${CIRC[j]}</span><span>${esc(t)}</span></button>`;
        }).join('')}</div>
        ${done ? `<div class="fb ${mk.ans[i] === x.a ? '' : 'bad'}"><div class="fb-head"><span class="mark">${mk.ans[i] === x.a ? '정답' : mk.ans[i] == null ? '미응답' : '오답'}</span><span class="muted">${esc(UN[x.u].name)}</span></div>${x.ex ? `<p class="ex">${esc(x.ex)}</p>` : ''}</div>` : ''}
      </div></section>`).join('');
  if (done) {
    const score = Math.round(mk.c / L.length * 100);
    const units = [...new Set(L.map(x => x.u))].sort((a, b) => UNITS.findIndex(u => u.id === a) - UNITS.findIndex(u => u.id === b));
    app.innerHTML = `<div class="result"><span class="score-mark">${score >= 90 ? '1등급 페이스!' : score >= 70 ? '조금만 더' : '복습 필요'}</span>
        <div class="score"><b>${score}</b><span>점</span></div>
        <p class="lead mt-s">${mk.c} / ${L.length} 정답 · 소요 시간 <span class="num">${fmt(mk.used)}</span></p></div>
      <h2>단원별 결과</h2>
      <div class="table-wrap"><table><thead><tr><th>단원</th><th class="r">정답</th></tr></thead><tbody>
      ${units.map(u => { const us = L.map((x, i) => [x, i]).filter(([x]) => x.u === u); const ok = us.filter(([x, i]) => mk.ans[i] === x.a).length;
        return `<tr><td>${esc(UN[u].name)}</td><td class="r num">${ok} / ${us.length}</td></tr>`; }).join('')}
      </tbody></table></div>
      <h2>답안</h2><div class="omr">${L.map(cell).join('')}</div>
      ${qs}
      <div class="row split mt-l"><button class="btn" data-act="go" data-v="wrong">오답노트</button><button class="btn primary" data-act="mkReset">새 모의시험</button></div>`;
    return;
  }
  const answeredN = Object.keys(mk.ans).length;
  app.innerHTML = `<h1>모의시험</h1><p class="lead">${L.length}문항 · 문항당 ${+(100 / L.length).toFixed(1)}점</p>
    <div class="omr" id="mk-omr">${L.map(cell).join('')}</div>
    ${qs}
    <div class="mbar"><div class="mbar-in">${mk.confirm
      ? `<span class="grow">${L.length - answeredN}문항을 풀지 않았어요. 제출할까요?</span><button class="btn sm" data-act="mkCancel">계속 풀기</button><button class="btn primary sm" data-act="mkSubmit">제출</button>`
      : `<span id="mk-time" class="num">${fmt(mk.end - Date.now())}</span><span class="grow muted">답안 <b id="mk-count" class="num">${answeredN}</b> / ${L.length}</span><button class="btn primary sm" data-act="mkAsk">제출</button>`}
    </div></div>`;
}

/* ---------- 오답노트 ---------- */
let wrongAsk = false;
function renderWrong() {
  const items = Object.entries(store.wrong).map(([id, w]) => ({x: byId[id], w})).filter(o => o.x)
    .sort((a, b) => b.w.n - a.w.n || b.w.t - a.w.t);
  if (!items.length) { app.innerHTML = empty('오답이 없어요. 퀴즈나 개념 확인에서 틀린 문제가 여기에 모여요.'); return; }
  const nq = items.filter(o => o.x.o).length, nk = items.length - nq;
  app.innerHTML = `<h1>오답노트</h1><p class="lead">${items.length}문항 · 복습에서 맞히면 자동으로 빠져요</p>
    <div class="row mt">
      ${nq ? `<button class="btn primary sm" data-act="retryQuiz">퀴즈 오답 다시 풀기 · ${nq}</button>` : ''}
      ${nk ? `<button class="btn sm" data-act="retryCheck">개념 오답 다시 풀기 · ${nk}</button>` : ''}
    </div>
    <div class="list mt-l">${items.map(({x, w}) => `<article class="li">
      <div class="li-meta"><span>${x.o ? '퀴즈' : x.t === 'ox' ? 'O/X' : '빈칸'} · ${esc(UN[x.u].name)} · ${w.n}번 틀림</span><button class="link" data-act="wrongDel" data-id="${x.id}">지우기</button></div>
      <div class="li-q">${x.o ? stemHtml(x.q) : x.t === 'bl' ? blankHtml(x.q, null) : esc(x.q)}</div>
      <p class="li-a"><b>정답</b>${x.o ? CIRC[x.a] + ' ' + esc(x.o[x.a]) : esc(ansText(x))}</p>
      ${x.ex ? `<p class="ex">${esc(x.ex)}</p>` : ''}
    </article>`).join('')}</div>
    <div class="row mt">${wrongAsk
      ? `<span class="muted">오답노트를 비울까요?</span><button class="btn sm" data-act="wrongClearYes">비우기</button><button class="btn ghost sm" data-act="wrongClearNo">취소</button>`
      : `<button class="link" data-act="wrongClear">오답노트 비우기</button>`}</div>`;
}

/* ---------- 범위 선택 ---------- */
function openRange() {
  const sel = new Set(store.range && store.range.length ? store.range : UNITS.map(u => u.id));
  sheet.innerHTML = `<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="학습 범위">
    <div class="sheet-head"><b>학습 범위</b><button class="btn ghost sm" data-act="closeRange">닫기</button></div>
    <div class="row"><button class="toggle" data-act="rangeQuick" data-v="all">전체</button>${CHAPTERS.map(c => `<button class="toggle" data-act="rangeQuick" data-v="${c.id}">${c.name}만</button>`).join('')}</div>
    ${CHAPTERS.map(c => `<fieldset><legend>${c.name}</legend>${c.units.map(u => `<label class="chk">
      <input type="checkbox" id="r-${u}" value="${u}" ${sel.has(u) ? 'checked' : ''}><span class="grow">${esc(UN[u].name)}</span><span class="muted num">${cards.filter(x => x.u === u).length}</span></label>`).join('')}</fieldset>`).join('')}
    <div class="mt-l"><button class="btn primary block" data-act="applyRange">적용</button></div>
  </div>`;

}
const closeRange = () => { sheet.hidden = true; sheet.innerHTML = ''; };

/* ---------- 동작 ---------- */
const ACT = {
  go: d => { if (d.v === 'mock' && mk.phase === 'done' && view !== 'mock') {} go(d.v); },
  unitGo: d => { store.range = [d.u]; save(); fc = ck = qz = null; go(d.v); },
  resetAsk: () => { resetAsk = true; renderHome(); },
  resetNo: () => { resetAsk = false; renderHome(); },
  resetYes: () => { resetAsk = false; store = {known: {}, again: {}, wrong: {}, stats: {a: 0, c: 0}, range: store.range}; save(); fc = ck = qz = null; renderHome(); },

  flip: () => { if (!fc || fc.i >= fc.list.length || Date.now() - lastSwipe < 400) return; fc.flip = !fc.flip; const el = document.querySelector('.flash'); if (el) el.classList.toggle('is-flipped', fc.flip); },
  fcMark: d => {
    const c = fc.list[fc.i]; if (!c) return;
    if (d.k === '1') { store.known[c.id] = 1; delete store.again[c.id]; fc.k++; }
    else { store.again[c.id] = 1; delete store.known[c.id]; fc.a++; }
    save(); fc.i++; fc.flip = false; renderFlash();
  },
  fcPrev: () => { if (fc.i > 0) { fc.i--; fc.flip = false; renderFlash(); } },
  fcNext: () => { if (fc.i < fc.list.length) { fc.i++; fc.flip = false; renderFlash(); } },
  fcOpt: d => { fcOpt[d.k] = !fcOpt[d.k]; fcInit(); renderFlash(); },
  fcRestart: () => { fcOpt.only = false; fcInit(); renderFlash(); },
  fcOnlyAgain: () => { fcOpt.only = true; fcInit(); renderFlash(); },

  ckOX: d => { const x = ck.list[ck.i]; ckAnswer((d.v === '1') === x.a); },
  ckNext: () => { ck.i++; ck.ans = null; ck.ok = null; ck.input = ''; renderCheck(); window.scrollTo(0, 0); },
  ckOverride: () => {
    const x = ck.list[ck.i]; ck.ok = true; ck.c++; store.stats.c++;
    const w = store.wrong[x.id]; if (w) { if (w.n <= 1) delete store.wrong[x.id]; else w.n--; }
    save(); renderCheck();
  },
  ckRestart: () => { ckInit(); renderCheck(); },

  qzN: d => { qzN = +d.n; renderQuiz(); },
  qzStart: () => { qzInit(); renderQuiz(); },
  qzPick: d => { const x = qz.list[qz.i]; qz.pick = +d.i; const ok = qz.pick === x.a; if (ok) qz.c++; else qz.miss.push(x); record(x.id, ok, qz.review); renderQuiz(); },
  qzNext: () => { qz.i++; qz.pick = null; renderQuiz(); window.scrollTo(0, 0); },
  qzAgain: () => { qzInit(); renderQuiz(); },
  qzSetup: () => { qz = null; renderQuiz(); },

  mkN: d => { mk.n = +d.n; renderMock(); },
  mkStart: () => {
    const list = shuffle(quiz.filter(x => inRange(x.u))).slice(0, mk.n);
    const start = Date.now();
    mk = {phase: 'run', n: mk.n, list, ans: {}, start, end: start + list.length * 90000, confirm: false};
    startTimer(); render(); window.scrollTo(0, 0);
  },
  mkPick: d => {
    const q = +d.q, i = +d.i; mk.ans[q] = i;
    document.querySelectorAll(`#mq-${q} .opt`).forEach((b, j) => b.classList.toggle('sel', j === i));
    const cellEl = document.querySelectorAll('#mk-omr .omr-cell')[q]; if (cellEl) cellEl.classList.add('on');
    const cnt = document.getElementById('mk-count'); if (cnt) cnt.textContent = Object.keys(mk.ans).length;
  },
  mkJump: d => { const el = document.getElementById('mq-' + d.i); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); },
  mkAsk: () => { if (Object.keys(mk.ans).length < mk.list.length) { mk.confirm = true; renderMockKeep(); } else mkSubmit(); },
  mkCancel: () => { mk.confirm = false; renderMockKeep(); },
  mkSubmit: () => mkSubmit(),
  mkReset: () => { mk = {phase: 'setup', n: mk.n}; render(); window.scrollTo(0, 0); },

  wrongDel: d => { delete store.wrong[d.id]; save(); renderWrong(); },
  wrongClear: () => { wrongAsk = true; renderWrong(); },
  wrongClearNo: () => { wrongAsk = false; renderWrong(); },
  wrongClearYes: () => { wrongAsk = false; store.wrong = {}; save(); renderWrong(); },
  retryQuiz: () => { const l = Object.keys(store.wrong).map(id => byId[id]).filter(x => x && x.o); qzInit(l, true); go('quiz'); },
  retryCheck: () => { const l = Object.keys(store.wrong).map(id => byId[id]).filter(x => x && !x.o); ckInit(shuffle(l), true); go('check'); },

  openRange: () => openRange(),
  closeRange: () => closeRange(),
  rangeQuick: d => {
    const on = d.v === 'all' ? UNITS.map(u => u.id) : CHAPTERS.find(c => c.id === d.v).units;
    sheet.querySelectorAll('input[type=checkbox]').forEach(el => el.checked = on.includes(el.value));
  },
  applyRange: () => {
    const arr = [...sheet.querySelectorAll('input[type=checkbox]:checked')].map(el => el.value);
    store.range = !arr.length || arr.length === UNITS.length ? null : arr;
    save(); fc = ck = qz = null;
    if (mk.phase !== 'run') mk = {phase: 'setup', n: mk.n};
    closeRange(); render();
  }
};
function renderMockKeep() { const y = window.scrollY; renderMock(); window.scrollTo(0, y); }

document.addEventListener('click', e => {
  if (e.target === sheet) { closeRange(); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset, b);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form === 'ck' && ck && ck.ans == null) {
    const v = $('#ck-input').value.trim();
    const x = ck.list[ck.i];
    const ok = !!v && String(x.a).split('|').some(a => norm(a) === norm(v));
    ckAnswer(ok, v);
  }
});
document.addEventListener('keydown', e => {
  if (!sheet.hidden) { if (e.key === 'Escape') closeRange(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'button' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (view === 'flash' && fc && fc.i < fc.list.length) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); ACT.flip(); }
    else if (e.key === '1') ACT.fcMark({k: '0'});
    else if (e.key === '2') ACT.fcMark({k: '1'});
    else if (e.key === 'ArrowRight') ACT.fcNext();
    else if (e.key === 'ArrowLeft') ACT.fcPrev();
    return;
  }
  if (view === 'check' && ck && ck.ans == null && ck.list[ck.i] && ck.list[ck.i].t === 'ox') {
    if (/^[oO1]$/.test(e.key)) ACT.ckOX({v: '1'});
    else if (/^[xX2]$/.test(e.key)) ACT.ckOX({v: '0'});
    return;
  }
  if (view === 'quiz' && qz && qz.pick == null && qz.list[qz.i] && /^[1-5]$/.test(e.key) && +e.key <= qz.list[qz.i].o.length) {
    ACT.qzPick({i: String(+e.key - 1)});
    return;
  }
  if (e.key === 'Enter') { const nb = document.getElementById('nextBtn'); if (nb) { e.preventDefault(); nb.click(); } }
});

go('home');
